<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sushi by Lite</title>
    <script>
      // GitHub Pages SPA redirect: preserve the requested path+query+hash
      // and forward it to index.html under the project base, so BrowserRouter
      // can resolve the route on load.
      (function () {
        // User/org site at domain root (base: "/"). Use 1 for project sites (/<repo>/).
        var segmentCount = 0;
        var l = window.location;
        var path = l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/';
        var rest = l.pathname.slice(path.length).replace(/\/$/g, '');
        var redirect =
          l.protocol + '//' + l.host + path +
          '?p=/' + rest.replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
